name: Data Layering
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/flat.yml
permissions:
  contents: write
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup ENV Variables
        # https://www.base64encode.org/
        run: |
          echo ${{ secrets.ACTIONS_ENV }} | base64 -d > ./.env
      - name: Install dependencies
        run: npm ci
      - name: Pull MCU Timeline Sheet
        run: npm run pull-mcu-timeline-sheet
      - name: Pull TMDB data
        run: npm run pull
      - name: Pull character credits
        run: npm run pull-characters
      - name: Commit data changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "flat-data"
          git config user.email "flat-data@users.noreply.github.com"
          git commit -m "chore(data): pull latest TMDB data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
